services:
  mongodb:
    image: mongo:7
    container_name: sukalp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: ./apps/api
    container_name: sukalp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/sukalp_saas
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/src:/app/src

  web:
    build:
      context: ./apps/web
    container_name: sukalp-web
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  mongodb_data:
